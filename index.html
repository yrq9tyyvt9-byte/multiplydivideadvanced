<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprawdzian — Mnożenie i dzielenie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2fb;
    --card: #ffffff;
    --ink: #241d45;
    --ink-soft: #6b6494;
    --line: #e6e1f5;
    --accent: #7c4dff;
    --mult: #7c4dff;
    --div: #009e83;
    --good: #16a06f;
    --good-soft: #e3f7ee;
    --bad: #e0455e;
    --bad-soft: #fce4e8;
    --warn: #f2a33c;
    --shadow: 0 12px 40px rgba(60, 40, 130, 0.12);
    --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17122e;
      --card: #221b40;
      --ink: #f1eeff;
      --ink-soft: #a79fce;
      --line: #342a5a;
      --accent: #a98bff;
      --mult: #b49bff;
      --div: #3ddc97;
      --good: #3ddc97;
      --good-soft: #12352a;
      --bad: #ff7a90;
      --bad-soft: #3a1c24;
      --warn: #ffbf6b;
      --shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17122e;
    --card: #221b40;
    --ink: #f1eeff;
    --ink-soft: #a79fce;
    --line: #342a5a;
    --accent: #a98bff;
    --mult: #b49bff;
    --div: #3ddc97;
    --good: #3ddc97;
    --good-soft: #12352a;
    --bad: #ff7a90;
    --bad-soft: #3a1c24;
    --warn: #ffbf6b;
    --shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }

  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 14px 90px;
    gap: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 640px;
    padding: 28px 22px 32px;
  }

  .brand {
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0 0 4px;
    font-size: 27px;
  }
  .brand .x { color: var(--mult); }
  .brand .d { color: var(--div); }
  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.5;
  }

  .field-row { margin: 0 0 20px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 6px; }
  .name-input {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    color: var(--ink); font-family: var(--font-body); font-size: 15px; padding: 10px 12px;
  }
  .name-input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

  .time-choice {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 0 0 24px;
  }
  .time-label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .time-btns { display: flex; flex-wrap: wrap; gap: 6px; background: var(--bg); padding: 5px; border-radius: 14px; border: 1px solid var(--line); }
  .time-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .time-btn.is-active { background: var(--accent); color: #fff; }
  .time-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .start-btn {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 18px 20px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #7c4dff, #a98bff);
    transition: transform .12s ease, filter .12s ease;
  }
  .start-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .start-btn:active { transform: translateY(0); }
  .start-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .info {
    margin-top: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.6;
  }

  /* ---- sticky top bar on test screen ---- */
  .topbar {
    position: sticky;
    top: calc(8px + env(safe-area-inset-top, 0px));
    z-index: 50;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    max-width: 640px;
    font-family: var(--font-display);
  }
  .topbar .clock { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .topbar .clock.warn { color: var(--warn); }
  .topbar .clock.danger { color: var(--bad); }
  .topbar .progress { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

  /* ---- task cards ---- */
  .task-card { margin-bottom: 4px; }
  .task-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0 0 2px; }
  .task-instruction { color: var(--ink-soft); font-size: 14px; margin: 0 0 16px; }
  .group { margin-bottom: 14px; }
  .group:last-child { margin-bottom: 0; }
  .group-letter {
    font-family: var(--font-display); font-weight: 600; font-size: 14px;
    color: var(--ink-soft); margin-bottom: 8px;
  }
  .q-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 2px; border-bottom: 1px dashed var(--line); flex-wrap: wrap;
  }
  .q-row:last-child { border-bottom: none; }
  .q-label { font-size: 16px; color: var(--ink); flex: 1 1 auto; min-width: 140px; }
  .q-sentence { font-size: 15.5px; color: var(--ink); line-height: 1.7; }
  .q-input {
    width: 92px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    text-align: center;
    padding: 8px 6px;
  }
  .q-input.inline { width: 76px; margin: 0 4px; vertical-align: middle; }
  .q-input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .q-input.ok { border-color: var(--good); background: var(--good-soft); }
  .q-input.no { border-color: var(--bad); background: var(--bad-soft); }
  .q-input:disabled { opacity: 1; }
  .q-correct-hint { font-size: 12px; color: var(--bad); font-weight: 600; flex: 0 0 100%; margin-top: -4px; }

  .submit-bar {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    display: flex;
    justify-content: center;
    z-index: 60;
  }
  .submit-btn {
    width: 100%; max-width: 640px;
    border: none; border-radius: 16px;
    padding: 16px 20px;
    font-family: var(--font-display); font-size: 18px; font-weight: 600;
    color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #009e83, #3ddc97);
    box-shadow: var(--shadow);
  }
  .submit-btn:active { transform: translateY(1px); }

  /* ---- result screen ---- */
  .grade-hero { text-align: center; margin-bottom: 18px; }
  .grade-num { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; }
  .grade-word { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-top: 4px; }
  .grade-score { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }
  .grade-time { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

  .breakdown { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0; }
  .breakdown-chip {
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
  }

  .review-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 18px 0 8px; }
  .review-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .review-row:last-child { border-bottom: none; }
  .review-row.ok .expr { color: var(--ink); }
  .review-row.no .expr { color: var(--bad); }
  .review-tag { font-size: 11px; color: var(--ink-soft); font-weight: 600; min-width: 56px; }
  .review-mid { flex: 1; display: flex; flex-direction: column; }
  .review-given { font-size: 12px; color: var(--bad); }
  .verdict { font-size: 16px; }

  .result-btns { display: grid; gap: 10px; margin-top: 20px; }
  .again-btn, .home-btn {
    border: none; border-radius: 16px; padding: 14px 18px;
    font-family: var(--font-display); font-weight: 600; font-size: 16px; cursor: pointer;
  }
  .again-btn { background: linear-gradient(135deg, #7c4dff, #a98bff); color: #fff; }
  .home-btn { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line); }

  [hidden] { display: none !important; }

  /* ---- admin dot + panel (reused pattern) ---- */
  .admin-dot {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: 14px; height: 14px; padding: 0; border: none; border-radius: 50%;
    background: var(--ink-soft); opacity: .45; box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer; z-index: 500;
  }
  .admin-dot:hover { opacity: 1; background: var(--accent); }
  .admin-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 900;
  }
  .admin-overlay[hidden] { display: none; }
  .admin-panel {
    width: 100%; max-width: 600px; max-height: 82vh; background: var(--card);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto; box-sizing: border-box;
  }
  @media (min-width: 640px) {
    .admin-overlay { align-items: center; }
    .admin-panel { border-radius: 20px; max-height: 78vh; }
  }
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .admin-head h2 { margin: 0; font-size: 18px; color: var(--ink); }
  .admin-close { border: none; background: var(--bg); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .admin-empty { color: var(--ink-soft); font-size: 14px; padding: 20px 0; text-align: center; }
  .admin-list { display: flex; flex-direction: column; gap: 10px; }
  .admin-item { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .admin-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .admin-item-main { font-size: 13px; color: var(--ink); display: flex; align-items: center; }
  .admin-item-meta { margin-top: 4px; font-size: 12px; color: var(--ink-soft); }
  .admin-grade-cell { font-weight: 700; font-size: 15px; }
  .admin-mistakes { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .admin-mistakes-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .admin-mistake-row { font-size: 12px; color: var(--bad); margin-top: 2px; }
  .admin-ok-note { margin-top: 8px; font-size: 12px; color: var(--good); }
  .admin-foot { margin-top: 14px; display: flex; justify-content: flex-end; }
  .admin-clear { border: none; background: transparent; color: var(--ink-soft); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ START ============ -->
  <section class="card" id="screen-start">
    <h1 class="brand"><span class="x">Sprawdzian</span> <span class="d">z matematyki</span></h1>
    <p class="subtitle">Mnożenie i dzielenie — 5 zadań, tak jak na kartkówce.</p>

    <div class="field-row">
      <label class="field-label" for="nameInput">Imię (opcjonalnie)</label>
      <input class="name-input" id="nameInput" type="text" maxlength="40" placeholder="np. Zuzia">
    </div>

    <div class="time-choice">
      <span class="time-label">Czas:</span>
      <div class="time-btns" id="timeBtns">
        <button class="time-btn is-active" data-seconds="0">Bez limitu</button>
        <button class="time-btn" data-seconds="300">5 min</button>
        <button class="time-btn" data-seconds="480">8 min</button>
        <button class="time-btn" data-seconds="720">12 min</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn">Rozpocznij test</button>

    <p class="info">5 zadań, 30 działań — tak jak w prawdziwym sprawdzianie.<br>Ocena jak w 4. klasie, zależnie od % poprawnych odpowiedzi.</p>
  </section>

  <!-- ============ TEST ============ -->
  <section id="screen-test" hidden style="width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:14px;">
    <div class="topbar">
      <span class="clock" id="clockText">00:00</span>
      <span class="progress" id="progressText">0 / 30</span>
    </div>
    <div id="tasksHost" style="width:100%; display:flex; flex-direction:column; gap:14px;"></div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="card" id="screen-result" hidden>
    <div class="grade-hero">
      <div class="grade-num" id="gradeNum">6</div>
      <div class="grade-word" id="gradeWord">Celujący!</div>
      <div class="grade-score" id="scoreText">30 / 30</div>
      <div class="grade-time" id="timeText"></div>
    </div>
    <div class="breakdown" id="breakdownHost"></div>
    <div class="review-title">Przegląd odpowiedzi</div>
    <div id="reviewHost"></div>
    <div class="result-btns">
      <button class="again-btn" id="againBtn">Nowy test</button>
      <button class="home-btn" id="homeBtn">Strona główna</button>
    </div>
  </section>

</div>

<button class="admin-dot" id="adminDot" aria-label="Panel administracyjny" title="Panel administracyjny"></button>

<div class="admin-overlay" id="adminOverlay" hidden>
  <div class="admin-panel">
    <div class="admin-head">
      <h2>Panel administracyjny</h2>
      <button class="admin-close" id="adminCloseBtn" aria-label="Zamknij">✕</button>
    </div>
    <div id="adminBody"></div>
    <div class="admin-foot">
      <button class="admin-clear" id="adminClearBtn">Wyczyść historię</button>
    </div>
  </div>
</div>

<!-- submit bar injected via JS only while test screen is visible -->
<div class="submit-bar" id="submitBar" hidden>
  <button class="submit-btn" id="submitBtn">Sprawdź</button>
</div>

<script>
(function () {
  "use strict";

  var el = {
    start: document.getElementById("screen-start"),
    test: document.getElementById("screen-test"),
    result: document.getElementById("screen-result"),
    nameInput: document.getElementById("nameInput"),
    timeBtns: document.querySelectorAll(".time-btn"),
    startBtn: document.getElementById("startBtn"),
    clockText: document.getElementById("clockText"),
    progressText: document.getElementById("progressText"),
    tasksHost: document.getElementById("tasksHost"),
    submitBar: document.getElementById("submitBar"),
    submitBtn: document.getElementById("submitBtn"),
    gradeNum: document.getElementById("gradeNum"),
    gradeWord: document.getElementById("gradeWord"),
    scoreText: document.getElementById("scoreText"),
    timeText: document.getElementById("timeText"),
    breakdownHost: document.getElementById("breakdownHost"),
    reviewHost: document.getElementById("reviewHost"),
    againBtn: document.getElementById("againBtn"),
    homeBtn: document.getElementById("homeBtn"),
    adminDot: document.getElementById("adminDot"),
    adminOverlay: document.getElementById("adminOverlay"),
    adminBody: document.getElementById("adminBody"),
    adminCloseBtn: document.getElementById("adminCloseBtn"),
    adminClearBtn: document.getElementById("adminClearBtn")
  };

  var chosenSeconds = 0; // 0 = bez limitu
  var state = null;

  function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

  // ---------- Question builders ----------
  function exprQ(id, a, opSym, b, answer) {
    return {
      id: id, kind: "expr", a: a, opSym: opSym, b: b, answer: answer,
      label: a + " " + opSym + " " + b,
      review: a + " " + opSym + " " + b + " = " + answer
    };
  }
  function sentenceQ(id, template, answer, review) {
    return { id: id, kind: "sentence", template: template, answer: answer, review: review };
  }
  function product3Q(id, a, b, c, answer) {
    return {
      id: id, kind: "product3", a: a, b: b, c: c, answer: answer,
      label: a + ", " + b + " i " + c,
      review: a + " · " + b + " · " + c + " = " + answer
    };
  }

  function buildTask1() {
    var a = [];
    var m1 = randInt(2, 9);
    a.push(exprQ("t1a0", m1, "·", 10, m1 * 10));
    var m2 = randInt(11, 99);
    a.push(exprQ("t1a1", m2, "·", 10, m2 * 10));
    var m3 = randInt(2, 9);
    a.push(exprQ("t1a2", m3, "·", 100, m3 * 100));
    var m4 = randInt(11, 99);
    a.push(exprQ("t1a3", m4, "·", 100, m4 * 100));

    var b = [];
    var q1 = randInt(2, 9);
    b.push(exprQ("t1b0", q1 * 10, ":", 10, q1));
    var q2 = randInt(11, 99);
    b.push(exprQ("t1b1", q2 * 10, ":", 10, q2));
    var q3 = randInt(2, 9);
    b.push(exprQ("t1b2", q3 * 100, ":", 100, q3));
    var q4 = randInt(11, 99);
    b.push(exprQ("t1b3", q4 * 100, ":", 100, q4));

    return { num: 1, instruction: "Oblicz.", groups: [{ letter: "a", qs: a }, { letter: "b", qs: b }] };
  }

  function buildTask2() {
    var a = [];
    var t1 = randInt(2, 9) * 10, d1 = randInt(2, 9);
    a.push(exprQ("t2a0", t1, "·", d1, t1 * d1));
    var d2 = randInt(2, 9), t2 = randInt(2, 9) * 10;
    a.push(exprQ("t2a1", d2, "·", t2, d2 * t2));
    var t3 = randInt(2, 9) * 10, t4 = randInt(2, 9) * 10;
    a.push(exprQ("t2a2", t3, "·", t4, t3 * t4));
    var h1 = randInt(2, 9) * 100, d3 = randInt(2, 9);
    a.push(exprQ("t2a3", h1, "·", d3, h1 * d3));

    var b = [];
    var dv1 = randInt(2, 9) * 10, qt1 = randInt(2, 9);
    b.push(exprQ("t2b0", dv1 * qt1, ":", dv1, qt1));
    var dv2 = randInt(2, 9) * 100, qt2 = randInt(2, 9);
    b.push(exprQ("t2b1", dv2 * qt2, ":", dv2, qt2));
    var dv3 = randInt(2, 9) * 10, qt3 = randInt(2, 9) * 10;
    b.push(exprQ("t2b2", dv3 * qt3, ":", dv3, qt3));
    var dvs = randInt(2, 9), qts = randInt(10, 99);
    b.push(exprQ("t2b3", dvs * qts, ":", dvs, qts));

    return { num: 2, instruction: "Oblicz.", groups: [{ letter: "a", qs: a }, { letter: "b", qs: b }] };
  }

  function buildTask3() {
    var a = [];
    for (var i = 0; i < 3; i++) {
      var sd = randInt(2, 9), td = randInt(11, 29);
      a.push(exprQ("t3a" + i, sd, "·", td, sd * td));
    }
    var b = [];
    for (var j = 0; j < 3; j++) {
      var dvd = randInt(2, 9), qq = randInt(2, 11);
      b.push(exprQ("t3b" + j, dvd * qq, ":", dvd, qq));
    }
    var c = [];
    for (var k = 0; k < 3; k++) {
      var divisor2 = randInt(11, 25), quotient2 = randInt(2, 10);
      c.push(exprQ("t3c" + k, divisor2 * quotient2, ":", divisor2, quotient2));
    }
    return { num: 3, instruction: "Oblicz.", groups: [{ letter: "a", qs: a }, { letter: "b", qs: b }, { letter: "c", qs: c }] };
  }

  function buildTask4() {
    var X1 = randInt(2, 9), Q1 = randInt(2, 15);
    var Y1 = X1 * Q1;
    var qa = sentenceQ(
      "t4a",
      "Liczba {{B}} jest " + X1 + " razy mniejsza niż " + Y1 + ".",
      Q1,
      "Liczba " + Q1 + " jest " + X1 + " razy mniejsza niż " + Y1 + "."
    );

    var X2 = randInt(2, 9), Y2 = randInt(2, 15);
    var B2 = X2 * Y2;
    var qb = sentenceQ(
      "t4b",
      "Liczba " + Y2 + " jest " + X2 + " razy mniejsza niż {{B}}.",
      B2,
      "Liczba " + Y2 + " jest " + X2 + " razy mniejsza niż " + B2 + "."
    );

    var S3 = randInt(2, 9), N3 = randInt(2, 9);
    var L3 = S3 * N3;
    var qc = sentenceQ(
      "t4c",
      "Liczba " + S3 + " jest {{B}} razy mniejsza niż " + L3 + ".",
      N3,
      "Liczba " + S3 + " jest " + N3 + " razy mniejsza niż " + L3 + "."
    );

    return { num: 4, instruction: "Wpisz odpowiednią liczbę w okienko.", groups: [{ letter: "a", qs: [qa] }, { letter: "b", qs: [qb] }, { letter: "c", qs: [qc] }] };
  }

  function buildTask5() {
    var a1 = randInt(2, 9), a2 = randInt(2, 9), a3 = randInt(2, 9);
    var qa = product3Q("t5a", a1, a2, a3, a1 * a2 * a3);

    var r1 = randInt(2, 9) * 10, r2 = randInt(2, 9), r3 = randInt(2, 9);
    var qb = product3Q("t5b", r1, r2, r3, r1 * r2 * r3);

    return { num: 5, instruction: "Oblicz iloczyny liczb.", groups: [{ letter: "a", qs: [qa] }, { letter: "b", qs: [qb] }] };
  }

  function buildAllTasks() {
    return [buildTask1(), buildTask2(), buildTask3(), buildTask4(), buildTask5()];
  }

  function flattenQuestions(tasks) {
    var map = {};
    for (var i = 0; i < tasks.length; i++) {
      for (var g = 0; g < tasks[i].groups.length; g++) {
        var grp = tasks[i].groups[g];
        for (var q = 0; q < grp.qs.length; q++) {
          var item = grp.qs[q];
          item._task = tasks[i].num;
          item._letter = grp.letter;
          map[item.id] = item;
        }
      }
    }
    return map;
  }

  // ---------- Rendering: test screen ----------
  function renderTasks(tasks) {
    var html = "";
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      html += '<div class="card task-card">';
      html += '<h2 class="task-title">Zadanie ' + t.num + '.</h2>';
      html += '<p class="task-instruction">' + t.instruction + '</p>';
      for (var g = 0; g < t.groups.length; g++) {
        var grp = t.groups[g];
        html += '<div class="group">';
        if (t.groups.length > 1 || grp.letter) {
          html += '<div class="group-letter">' + grp.letter + ')</div>';
        }
        for (var q = 0; q < grp.qs.length; q++) {
          var item = grp.qs[q];
          html += '<div class="q-row" data-qid="' + item.id + '">';
          if (item.kind === "expr") {
            html += '<span class="q-label">' + item.label + ' =</span>';
            html += '<input class="q-input" type="text" inputmode="numeric" autocomplete="off" id="in_' + item.id + '">';
          } else if (item.kind === "product3") {
            html += '<span class="q-label">' + item.label + ' =</span>';
            html += '<input class="q-input" type="text" inputmode="numeric" autocomplete="off" id="in_' + item.id + '">';
          } else if (item.kind === "sentence") {
            var parts = item.template.split("{{B}}");
            html += '<span class="q-sentence">' + parts[0] +
              '<input class="q-input inline" type="text" inputmode="numeric" autocomplete="off" id="in_' + item.id + '">' +
              parts[1] + '</span>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    el.tasksHost.innerHTML = html;

    // wire input listeners for live progress + numeric filtering
    var inputs = el.tasksHost.querySelectorAll(".q-input");
    for (var n = 0; n < inputs.length; n++) {
      inputs[n].addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, "").slice(0, 5);
        updateProgress();
      });
    }
  }

  function countTotal() {
    return Object.keys(state.qmap).length;
  }
  function countAnswered() {
    var n = 0;
    var keys = Object.keys(state.qmap);
    for (var i = 0; i < keys.length; i++) {
      var inp = document.getElementById("in_" + keys[i]);
      if (inp && inp.value.trim() !== "") n++;
    }
    return n;
  }
  function updateProgress() {
    el.progressText.textContent = countAnswered() + " / " + countTotal();
  }

  // ---------- Timer ----------
  function fmtClock(totalSeconds) {
    var s = Math.max(0, Math.round(totalSeconds));
    var m = Math.floor(s / 60);
    var r = s % 60;
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return pad(m) + ":" + pad(r);
  }

  function stopTimer() {
    if (state && state.intervalId) {
      clearInterval(state.intervalId);
      state.intervalId = null;
    }
  }

  function tickClock() {
    if (chosenSeconds > 0) {
      state.timeLeft--;
      el.clockText.textContent = fmtClock(state.timeLeft);
      el.clockText.className = "clock" + (state.timeLeft <= 30 ? " danger" : (state.timeLeft <= 60 ? " warn" : ""));
      if (state.timeLeft <= 0) {
        state.timedOut = true;
        stopTimer();
        finish();
      }
    } else {
      var elapsed = (Date.now() - state.startedAt) / 1000;
      el.clockText.textContent = fmtClock(elapsed);
    }
  }

  function startTimer() {
    stopTimer();
    if (chosenSeconds > 0) {
      state.timeLeft = chosenSeconds;
      el.clockText.textContent = fmtClock(state.timeLeft);
      el.clockText.className = "clock";
    } else {
      el.clockText.textContent = "00:00";
      el.clockText.className = "clock";
    }
    state.intervalId = setInterval(tickClock, 1000);
  }

  // ---------- Start a test ----------
  function startTest() {
    var tasks = buildAllTasks();
    var qmap = flattenQuestions(tasks);
    state = {
      tasks: tasks,
      qmap: qmap,
      startedAt: Date.now(),
      timedOut: false,
      intervalId: null,
      timeLeft: chosenSeconds
    };
    renderTasks(tasks);
    updateProgress();
    el.start.hidden = true;
    el.result.hidden = true;
    el.test.hidden = false;
    el.submitBar.hidden = false;
    window.scrollTo(0, 0);
    startTimer();
  }

  // ---------- Grading ----------
  function gradeFor(score, total) {
    var pct = total > 0 ? score / total : 0;
    if (pct >= 1) return { num: "6", word: "Celujący! 🌟" };
    if (pct >= 0.9) return { num: "5", word: "Bardzo dobry!" };
    if (pct >= 0.8) return { num: "4", word: "Dobry" };
    if (pct >= 0.7) return { num: "3", word: "Dostateczny" };
    if (pct >= 0.6) return { num: "2", word: "Dopuszczający" };
    return { num: "1", word: "Trzeba jeszcze poćwiczyć" };
  }
  function gradeColor(num) {
    var n = parseInt(num, 10);
    if (n >= 5) return "var(--good)";
    if (n >= 3) return "var(--accent)";
    return "var(--bad)";
  }

  function finish() {
    stopTimer();
    var keys = Object.keys(state.qmap);
    var score = 0;
    var mistakes = [];
    var perTask = {}; // num -> {score, total}

    for (var i = 0; i < keys.length; i++) {
      var q = state.qmap[keys[i]];
      perTask[q._task] = perTask[q._task] || { score: 0, total: 0 };
      perTask[q._task].total++;

      var inp = document.getElementById("in_" + q.id);
      var raw = inp ? inp.value.trim() : "";
      var given = raw === "" ? null : parseInt(raw, 10);
      var isRight = given !== null && !isNaN(given) && given === q.answer;

      if (inp) {
        inp.disabled = true;
        inp.classList.add(isRight ? "ok" : "no");
      }

      if (isRight) {
        score++;
        perTask[q._task].score++;
      } else {
        mistakes.push({
          task: q._task, letter: q._letter, review: q.review,
          given: given === null ? null : given
        });
      }
    }

    var total = keys.length;
    var g = gradeFor(score, total);
    var elapsedMs = Date.now() - state.startedAt;

    el.submitBar.hidden = true;
    el.test.hidden = true;
    el.result.hidden = false;

    el.gradeNum.textContent = g.num;
    el.gradeNum.style.color = gradeColor(g.num);
    el.gradeWord.textContent = g.word;
    el.scoreText.textContent = score + " / " + total;
    el.timeText.textContent = "⏱ czas rozwiązania: " + fmtDuration(elapsedMs) + (state.timedOut ? " · czas minął" : "");

    var bHtml = "";
    for (var tn = 1; tn <= 5; tn++) {
      if (perTask[tn]) {
        bHtml += '<span class="breakdown-chip">Zad. ' + tn + ': ' + perTask[tn].score + '/' + perTask[tn].total + '</span>';
      }
    }
    el.breakdownHost.innerHTML = bHtml;

    var rHtml = "";
    for (var m = 0; m < mistakes.length; m++) {
      var mi = mistakes[m];
      rHtml += '<div class="review-row no">' +
        '<span class="review-tag">Zad. ' + mi.task + mi.letter + '</span>' +
        '<span class="review-mid"><span class="expr">' + mi.review + '</span>' +
        '<span class="review-given">Podano: ' + (mi.given === null ? "—" : mi.given) + '</span></span>' +
        '<span class="verdict">✗</span></div>';
    }
    if (!mistakes.length) {
      rHtml = '<div class="review-row ok"><span class="expr" style="color:var(--good)">Wszystko poprawnie! 🎉</span></div>';
    }
    el.reviewHost.innerHTML = rHtml;

    saveResult(score, total, g, elapsedMs, mistakes);
  }

  // ---------- Panel administracyjny (historia na tym urządzeniu) ----------
  var ADMIN_KEY = "sprawdzian_gwo_wyniki_v1";
  var ADMIN_MAX = 200;

  function loadResults() {
    try {
      var raw = localStorage.getItem(ADMIN_KEY);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function saveResult(score, total, grade, elapsedMs, mistakes) {
    try {
      var list = loadResults();
      list.unshift({
        t: Date.now(),
        name: (el.nameInput.value || "").trim(),
        score: score,
        total: total,
        gradeNum: grade.num,
        gradeWord: grade.word,
        ms: (typeof elapsedMs === "number" && !isNaN(elapsedMs)) ? elapsedMs : null,
        mistakes: mistakes || []
      });
      if (list.length > ADMIN_MAX) list = list.slice(0, ADMIN_MAX);
      localStorage.setItem(ADMIN_KEY, JSON.stringify(list));
    } catch (e) {
      // brak dostępu do localStorage — pomijamy zapis
    }
  }

  function fmtDuration(ms) {
    if (typeof ms !== "number" || isNaN(ms) || ms < 0) return "—";
    var totalSec = Math.round(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return m + ":" + pad(s);
  }

  function fmtDate(ts) {
    try {
      var d = new Date(ts);
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };
      return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    } catch (e) {
      return "";
    }
  }

  function renderAdmin() {
    var list = loadResults();
    if (!list.length) {
      el.adminBody.innerHTML = '<p class="admin-empty">Brak zapisanych wyników na tym urządzeniu.</p>';
      return;
    }
    var html = '<div class="admin-list">';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var who = r.name ? (r.name + " &middot; ") : "";
      html += '<div class="admin-item">';
      html += '<div class="admin-item-head">';
      html += '<span class="admin-item-main">' + who + fmtDate(r.t) + '</span>';
      html += '<span class="admin-item-main"><span class="admin-grade-cell" style="color:' + gradeColor(r.gradeNum) + '">' + r.gradeNum + '</span>&nbsp;&middot;&nbsp;' + r.score + ' / ' + r.total + '</span>';
      html += '</div>';
      html += '<div class="admin-item-meta">Czas rozwiązania: ' + fmtDuration(r.ms) + '</div>';
      if (r.mistakes && r.mistakes.length) {
        html += '<div class="admin-mistakes"><div class="admin-mistakes-label">Błędy (' + r.mistakes.length + '):</div>';
        for (var k = 0; k < r.mistakes.length; k++) {
          var m = r.mistakes[k];
          var givenTxt = (m.given === null || m.given === undefined) ? "brak odpowiedzi" : m.given;
          html += '<div class="admin-mistake-row">Zad. ' + m.task + m.letter + ': ' + m.review + ' — podano: ' + givenTxt + '</div>';
        }
        html += '</div>';
      } else {
        html += '<div class="admin-ok-note">Brak błędów 🎉</div>';
      }
      html += '</div>';
    }
    html += '</div>';
    el.adminBody.innerHTML = html;
  }

  function openAdmin() {
    renderAdmin();
    el.adminOverlay.hidden = false;
  }
  function closeAdmin() {
    el.adminOverlay.hidden = true;
  }

  // ---------- Events ----------
  for (var t = 0; t < el.timeBtns.length; t++) {
    el.timeBtns[t].addEventListener("click", function () {
      for (var k = 0; k < el.timeBtns.length; k++) el.timeBtns[k].classList.remove("is-active");
      this.classList.add("is-active");
      chosenSeconds = parseInt(this.getAttribute("data-seconds"), 10) || 0;
    });
  }

  el.startBtn.addEventListener("click", startTest);
  el.submitBtn.addEventListener("click", function () {
    if (!state) return;
    finish();
  });
  el.againBtn.addEventListener("click", startTest);
  el.homeBtn.addEventListener("click", function () {
    stopTimer();
    el.result.hidden = true;
    el.test.hidden = true;
    el.submitBar.hidden = true;
    el.start.hidden = false;
  });

  el.adminDot.addEventListener("click", openAdmin);
  el.adminCloseBtn.addEventListener("click", closeAdmin);
  el.adminOverlay.addEventListener("click", function (e) {
    if (e.target === el.adminOverlay) closeAdmin();
  });
  el.adminClearBtn.addEventListener("click", function () {
    if (window.confirm("Usunąć całą historię wyników z tego urządzenia?")) {
      try { localStorage.removeItem(ADMIN_KEY); } catch (e) {}
      renderAdmin();
    }
  });

})();
</script>
</body>
</html>
